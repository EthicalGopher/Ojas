apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"].execute(null, rootDir).text.trim())
    hermesCommand = new File(["node", "--print", "try { require.resolve('hermes-compiler/package.json') } catch(e) { require.resolve('react-native/package.json') }"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + (new File(["node", "--print", "try { require.resolve('hermes-compiler/package.json') } catch(e) { '' }"].execute(null, rootDir).text.trim()).exists() ? "/hermesc/%OS-BIN%/hermesc" : "/sdks/hermesc/%OS-BIN%/hermesc")
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

    enableBundleCompression = (findProperty('android.enableBundleCompression') ?: false).toBoolean()
    // Use Expo CLI to bundle the app, this ensures the Metro config
    // works correctly with Expo projects.
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"

    /* Folders */
     //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]

    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true in release builds to optimize the app using [R8](https://developer.android.com/topic/performance/app-optimization/enable-app-optimization).
 */
def enableMinifyInReleaseBuilds = (findProperty('android.enableMinifyInReleaseBuilds') ?: false).toBoolean()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// ---------- Play Asset Delivery packs ----------
// The two optional asset packs (pose_heavy, tree_pose) live in their own Gradle modules under android/.
//  - packsAsAssets=true  (APK builds, the default): their files are added to this app's assets, so the app
//    works with no Play Store and the native side reports every pack as ready.
//  - packsAsAssets=false (bundle builds): they are real Play asset packs, delivered fast-follow.
// The default follows the requested task; the task graph is checked again below, so an abbreviation, an
// IDE run or a wrapper can never ship the packs inside the base module (or ship an APK without them).
def requestedTasks = gradle.startParameter.taskNames
def isBundleRequest = requestedTasks.any { it ==~ /^(:app:)?bundle(Debug|Release)$/ }
def packsAsAssets = (findProperty('packsAsAssets') ?: (isBundleRequest ? 'false' : 'true')).toBoolean()
// Packs whose delivery is install-time are served from the APK assets after install.
def installTimePacks = ['pose_heavy', 'tree_pose'].findAll { (findProperty("packDelivery_${it}") ?: 'fast-follow') == 'install-time' }

if (findProperty('abiFilters') && findProperty('reactNativeArchitectures') && findProperty('abiFilters') != findProperty('reactNativeArchitectures')) {
    throw new GradleException('abiFilters and reactNativeArchitectures must match (a mismatch drops libreactnative.so).')
}

gradle.taskGraph.whenReady { graph ->
    def names = graph.allTasks.findAll { it.project.path == ':app' }*.name
    if (names.any { it ==~ /^bundle(Debug|Release)$/ }) {
        if (packsAsAssets) throw new GradleException('Bundle builds need packsAsAssets=false: the packs would end up inside the base module.')
        if (!findProperty('versionCode')) throw new GradleException('Bundle builds need -PversionCode=<n> (Play rejects repeated codes). Use `make aab VERSION_CODE=<n>`.')
    }
    if (!packsAsAssets && names.any { it ==~ /^(assemble|install|package)(Debug|Release)$/ }) {
        throw new GradleException('APK builds need packsAsAssets=true: the pack files would be missing from the APK.')
    }
}

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'com.sankhyah.expocameratest'
    defaultConfig {
        applicationId 'com.sankhyah.expocameratest'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"

        buildConfigField "boolean", "PACKS_AS_ASSETS", "${packsAsAssets}"
        buildConfigField "String", "INSTALL_TIME_PACKS", "\"${installTimePacks.join(',')}\""

        // Bundle builds (make aab) pass -PabiFilters so third-party libraries ship only the listed ABIs;
        // reactNativeArchitectures only limits React Native's own native build.
        if (findProperty('abiFilters')) {
            ndk {
                abiFilters.addAll(findProperty('abiFilters').split(',').toList())
            }
        }

        buildConfigField "String", "REACT_NATIVE_RELEASE_LEVEL", "\"${findProperty('reactNativeReleaseLevel') ?: 'stable'}\""
    }
    // Release signing credentials live in android/keystore.properties (gitignored).
    // Create them with `make keystore`; without that file, release builds fall back to debug signing.
    def keystorePropsFile = rootProject.file('keystore.properties')
    def keystoreProps = new Properties()
    if (keystorePropsFile.exists()) {
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
    }
    def hasReleaseKeystore = keystoreProps['storeFile'] && file(keystoreProps['storeFile']).exists()

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseKeystore) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            // Dev-only fault injection for the pack states (see PackFault.kt); release builds never read it.
            buildConfigField "String", "PACK_FAULT", "\"${findProperty('packFault') ?: ''}\""
            // Same key as release when it's available, so the dev build and the release APK can
            // replace each other on a device (Android rejects updates signed by a different key).
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
        release {
            buildConfigField "String", "PACK_FAULT", "\"\""
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            } else {
                logger.warn("WARNING: android/keystore.properties not found - signing release with the DEBUG key. Run `make keystore` for a production key.")
                signingConfig signingConfigs.debug
            }
            def enableShrinkResources = findProperty('android.enableShrinkResourcesInReleaseBuilds') ?: 'false'
            shrinkResources enableShrinkResources.toBoolean()
            minifyEnabled enableMinifyInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            def enablePngCrunchInRelease = findProperty('android.enablePngCrunchInReleaseBuilds') ?: 'true'
            crunchPngs enablePngCrunchInRelease.toBoolean()
        }
    }
    packagingOptions {
        jniLibs {
            def enableLegacyPackaging = findProperty('expo.useLegacyPackaging') ?: 'false'
            useLegacyPackaging enableLegacyPackaging.toBoolean()
        }
    }
    // See the Play Asset Delivery note above: pack files come in as plain assets, or as real asset packs.
    if (packsAsAssets) {
        sourceSets.main.assets.srcDir("$rootDir/pose_heavy/src/main/assets")
        sourceSets.main.assets.srcDir("$rootDir/tree_pose/src/main/assets")
    } else {
        assetPacks = [':pose_heavy', ':tree_pose']
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
        // Stored uncompressed so LocalAssetServer streams them with an exact Content-Length.
        noCompress 'onnx', 'wasm', 'vrm', 'glb'
    }
}

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

// Play needs a higher versionCode on every upload. The literals above stay in place (so tools that edit
// them keep working); -PversionCode / -PversionName override them per build (see `make aab`).
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            if (findProperty('versionCode')) output.versionCode.set(findProperty('versionCode').toInteger())
            if (findProperty('versionName')) output.versionName.set(findProperty('versionName'))
        }
    }
}

// Bundle verification (plain file access only). Fails if no .aab is found, if a pack file is inside the
// base module, or if a pack module's file is missing from the bundle.
def bundleOutputDir = layout.buildDirectory.dir('outputs/bundle')
tasks.register('verifyBundleContents') {
    doLast {
        def root = bundleOutputDir.get().asFile
        def aabs = []
        if (root.exists()) {
            root.eachFileRecurse(groovy.io.FileType.FILES) { if (it.name.endsWith('.aab')) aabs << it }
        }
        if (aabs.isEmpty()) throw new GradleException('verifyBundleContents found no .aab to inspect.')
        aabs.each { aab ->
            def zip = new java.util.zip.ZipFile(aab)
            try {
                def entries = zip.entries().collect { it.name }
                if (entries.any { it == 'base/assets/web/pose_landmark_heavy.tflite' || it.startsWith('base/assets/web/tree_pose/') }) {
                    throw new GradleException("Pack files found in the base module of ${aab.name}")
                }
                ['pose_heavy/assets/web/pose_landmark_heavy.tflite', 'tree_pose/assets/web/tree_pose/tree_pose_classifier.onnx'].each { need ->
                    if (!entries.contains(need)) throw new GradleException("Missing ${need} in ${aab.name}")
                }
            } finally {
                zip.close()
            }
        }
    }
}
tasks.matching { it.name ==~ /^bundle(Debug|Release)$/ }.configureEach { it.finalizedBy('verifyBundleContents') }

dependencies {
    // Play Asset Delivery client (pack state, location, fetch).
    implementation 'com.google.android.play:asset-delivery:2.3.0'
    testImplementation 'junit:junit:4.13.2'

    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true";
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true";
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true";

    if (isGifEnabled) {
        // For animated gif support
        implementation("com.facebook.fresco:animated-gif:${expoLibs.versions.fresco.get()}")
    }

    if (isWebpEnabled) {
        // For webp support
        implementation("com.facebook.fresco:webpsupport:${expoLibs.versions.fresco.get()}")
        if (isWebpAnimatedEnabled) {
            // Animated webp support
            implementation("com.facebook.fresco:animated-webp:${expoLibs.versions.fresco.get()}")
        }
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
